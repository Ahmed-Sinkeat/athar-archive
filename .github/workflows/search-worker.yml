# Deploys the search API Worker (workers/search → search.arthurarchive.com) on its own, in
# seconds, whenever search code changes; the site's /api/search forwards to it.
name: Search Worker

on:
  push:
    branches: [main]
    paths:
      - workers/search/**
      - src/lib/search-handler.ts
      - src/lib/search-rank.ts
      - src/lib/ar-normalize.ts
      - .github/workflows/search-worker.yml
  workflow_dispatch:

concurrency: search-worker

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler deploy -c workers/search/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
