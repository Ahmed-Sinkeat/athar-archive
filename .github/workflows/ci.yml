name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deploys must land in commit order — without this, two concurrent runs can
# finish out of order and an older build overwrites a newer deploy. On PRs,
# cancelling a superseded run is fine (nothing user-facing is mid-flight). On
# push to main, cancelling is NOT fine — it can kill an in-progress R2 upload
# mid-way, leaving live pages 404ing until the next push (see 2026-07-17
# incident). A queued-not-cancelled run still lands in order, just without
# killing the one ahead of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Two independent kinds of prerender work, decoupled via BUILD_ROLE
  # (src/lib/build-shard.ts) so neither carries the other's cost:
  #   - build-primary: the ~5.4k regular-route pages (every route EXCEPT
  #     book-pages/[slug]/[chapter].astro), once.
  #   - build-chapters: book-pages/[slug]/[chapter].astro alone, ~75k pages —
  #     dwarfs every other route combined — split BUILD_SHARD_COUNT ways.
  # Both only produce artifacts; finish (below) merges + deploys.
  build-primary:
    runs-on: ubuntu-latest
    env:
      # astro build opens a remote Cloudflare session to resolve the R2 binding
      # (wrangler.toml's BOOK_ASSETS bucket, remote=true). Deliberately exposes
      # the token to this job's deps, unlike the deploy job below.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # ubuntu-latest has 7GB; the corpus outgrew V8's default heap during
      # prerender and search-index generation alike (both OOM'd separately).
      NODE_OPTIONS: --max-old-space-size=6656
      BUILD_ROLE: primary
      BUILD_SHARD_COUNT: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # ubuntu-latest ships ~30GB of preinstalled SDKs this Node/Astro project
      # never touches (Android, .NET, GHC/Haskell). The corpus's static build
      # (one HTML file per book-page across the whole /book-pages/ tree) grew
      # past the runner's remaining free disk — ENOSPC mid-generate (2026-07-21)
      # — so free that space before the build needs it, same growth pattern
      # that already forced the NODE_OPTIONS heap bump below.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build-time data (the largest book markdown) lives in R2, not git LFS —
      # LFS's 1GB/month bandwidth quota kept killing CI; R2 egress is free.
      - name: Fetch build data from R2
        run: pnpm data:fetch

      - name: Cache Astro data store
        uses: actions/cache@v4
        with:
          path: .astro
          key: astro-${{ hashFiles('src/content/**') }}
          restore-keys: astro-

      # Reinstates the 2026-06-24 fix (065b8d7a) that this pipeline lost when
      # build-primary/build-chapters were split out — sync and build had gone
      # back to running as one process, piling content-parsing memory on top
      # of Vite's render-phase memory instead of releasing it in between.
      # Content grew ~1GB since (198 more imported books, several 50-80MB each)
      # on top of an already-large corpus, enough to OOM even the 7GB runner
      # doing both in one go (2026-07-29). Same fix, same reasoning: sync
      # exits and V8 releases its parsing memory before build starts fresh.
      - name: Sync Astro content
        run: pnpm exec astro sync
        env:
          NODE_OPTIONS: --max-old-space-size=6656

      - name: Unit tests
        run: pnpm test

      - name: Validate content
        run: pnpm build:prep

      - name: Build (Astro prerender — regular routes only, zero chapters)
        run: pnpm exec astro build

      - name: Upload primary dist
        uses: actions/upload-artifact@v4
        with:
          name: build-primary
          path: dist
          retention-days: 1

  build-chapters:
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NODE_OPTIONS: --max-old-space-size=6656
      BUILD_ROLE: chapters
      BUILD_SHARD: ${{ matrix.shard }}
      BUILD_SHARD_COUNT: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch build data from R2
        run: pnpm data:fetch

      - name: Cache Astro data store
        uses: actions/cache@v4
        with:
          path: .astro
          key: astro-${{ hashFiles('src/content/**') }}
          restore-keys: astro-

      # See the matching step in build-primary — same 2026-06-24 fix
      # (065b8d7a) reinstated for the same reason: sync as its own process so
      # V8 releases parsing memory before this shard's astro build starts.
      - name: Sync Astro content
        run: pnpm exec astro sync
        env:
          NODE_OPTIONS: --max-old-space-size=6656

      - name: Validate content
        run: pnpm build:prep

      - name: Build (Astro prerender — this shard's slice of chapters only)
        run: pnpm exec astro build

      # Rides in the artifact so the finish job can prove the merge kept every
      # chapter this shard rendered (see "Merge shard chapter pages + verify").
      - name: Record this shard's chapter count
        run: find dist/client/book-pages -name index.html | wc -l > dist/client/book-pages/.count-shard-${{ matrix.shard }}

      - name: Upload this shard's book-chapter pages
        uses: actions/upload-artifact@v4
        with:
          name: book-pages-shard-${{ matrix.shard }}
          path: dist/client/book-pages
          retention-days: 1

  # Merges build-chapters' output into build-primary's dist/, then runs
  # everything that needs the FULL page set once: post-processing, the
  # verification gates, search indexing, and deploy.
  finish:
    needs: [build-primary, build-chapters]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      NODE_OPTIONS: --max-old-space-size=6656
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # This job briefly holds the merged dist (~27GB) plus the r2-staging pass
      # over it, so it needs every GB the image will give up — the extra paths
      # and docker prune below buy ~10GB more than the build jobs' cleanup
      # (added after the corpus grew past ~3GB and the runner hit ENOSPC,
      # 2026-07-30).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af > /dev/null 2>&1 || true
          df -h / | tail -1

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # build:finish needs the large book markdown on disk, same as the build job.
      - name: Fetch build data from R2
        run: pnpm data:fetch

      - name: Download primary shard's dist
        uses: actions/download-artifact@v4
        with:
          name: build-primary
          path: dist

      # Download each shard artifact into its OWN dir — NOT merge-multiple.
      # download-artifact's merge-multiple silently dropped ~half the files when
      # unioning the 8 large shard artifacts into one directory, which took
      # roughly half the site's book chapters offline (all jobs still green).
      # cp-merge them explicitly below instead — deterministic — then verify the
      # union count equals the sum every shard recorded.
      - name: Download shard chapter artifacts (separate dirs)
        uses: actions/download-artifact@v4
        with:
          pattern: book-pages-shard-*
          path: dist/_shards

      - name: Merge shard chapter pages + verify none lost
        run: |
          mkdir -p dist/client/book-pages
          # hard-link rather than copy: same filesystem, ~78k files, and this
          # was 2m14s of pure byte-shuffling. gen-book-chapters.ts only ever
          # reads these and writes elsewhere, so sharing inodes is safe; the
          # `rm -rf dist/_shards` below then just drops a link. Falls back to a
          # real copy if the artifacts ever land on a different mount.
          for d in dist/_shards/book-pages-shard-*/; do
            cp -al "$d." dist/client/book-pages/ 2>/dev/null || cp -a "$d." dist/client/book-pages/
          done
          expected=$(cat dist/client/book-pages/.count-shard-* | awk '{s+=$1} END{print s}')
          actual=$(find dist/client/book-pages -name index.html | wc -l)
          rm -f dist/client/book-pages/.count-shard-*
          rm -rf dist/_shards
          echo "chapter pages: expected=$expected merged=$actual"
          if [ "$actual" -lt "$expected" ]; then
            echo "::error::merge lost $((expected - actual)) chapter page(s) — refusing to deploy a partial corpus"
            exit 1
          fi

      - name: Finish build (fragments, chapters → R2 staging, redirects, headers)
        run: pnpm build:finish

      - name: Smoke test (per-template invariants over dist/)
        run: pnpm smoke

      - name: Link integrity (internal links + redirects resolve over dist/)
        run: pnpm check:links

      - name: Render budget (page weight, JS-free content, RTL over dist/)
        run: pnpm perf:budget

      # This job never runs `astro build` itself (that happened in build-primary/
      # build-chapters, on other runners) — tsc needs the astro:content/
      # astro:middleware virtual-module types that only `astro build` or
      # `astro sync` generates, in THIS job's own workspace.
      - name: Sync Astro types (for type-check below)
        run: pnpm exec astro sync

      - name: Type-check
        run: pnpm exec tsc --noEmit --skipLibCheck

      # Fetch the remote doc_hash table (url→hash) so gen-search-index.ts can
      # diff against it and only emit SQL for docs that actually changed —
      # `|| true` in the pnpm script covers the first-ever run (table doesn't
      # exist yet) by falling back to a full rebuild.
      - name: Fetch search-index hashes
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm search:hashes

      # SQL for the D1 search index → dist/search-index/*.sql (loaded below).
      # Incremental (see gen-search-index.ts): a normal deploy touching a
      # handful of books costs a few hundred row writes, not a 30k-row full
      # reindex, so this can run on every push instead of being gated off.
      - name: Generate search index
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm search:gen

      # ponytail: deploy inline instead of a separate job — the old artifact
      # upload/download step was hitting the repo's Actions storage quota
      # (16.7k files per run). Same job already holds CLOUDFLARE_API_TOKEN
      # for the R2 binding above, so no security separation is lost.
      # Prerendered chapter pages are served from R2 at
      # request time (see docs/deploy.md). This MUST run before the Worker
      # deploy and MUST succeed: the pages reference this build's hashed
      # /_astro/*.css files, so deploying the Worker/assets first (or with a
      # half-finished upload) would serve chapters pointing at deleted CSS.
      # Diffs against a remote md5 index (upload-r2-assets.mjs): only changed
      # pages upload. Stored pages carry stable /_astro-live/ placeholders
      # instead of hashed asset URLs (gen-book-chapters.ts §4), so CSS/JS-only
      # changes upload nothing — only real markup/content changes do. The long
      # timeout covers template changes that legitimately dirty every page.
      # Direct S3-API uploads (upload-r2-assets.mjs) — needs the R2 S3
      # credentials below, NOT the wrangler API token. The script fails loudly
      # if they're missing rather than silently skipping (a skipped upload +
      # a deployed Worker = new chapters 404ing).
      - name: Upload chapter pages to R2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        # 40, not 20: the bulk import's first full upload measured
        # ~58 files/sec at CONCURRENCY=64 (run 30515310645, 2026-07-30) — 84977
        # new files needs ~24.4min, past the old 20min cap. One-time backlog;
        # steady-state uploads only carry the files that actually changed.
        timeout-minutes: 40
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: pnpm r2:upload

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c dist/server/wrangler.json

      # The Worker deploy above replaces /_astro/* wholesale — old hashed files
      # just stop existing. Cloudflare's edge cache (separate from the Workers
      # Cache API in middleware.ts, which the __v=X-Build-Id query param already
      # busts) doesn't know a deploy happened and keeps serving previously
      # cached HTML for up to s-maxage/stale-while-revalidate, which still
      # references those now-deleted asset hashes — a 404 on a page's own
      # <script>/<link> that self-inflicts a broken/stuck page until that one
      # URL's cache entry naturally expires. No purge-by-prefix on free/pro
      # plans, so this clears everything; the cost is a brief cache-miss window
      # right after each deploy, not a functional loss.
      # continue-on-error: same reasoning as the D1 step below — a purge
      # failure (bad token scope, stale zone ID, transient API error)
      # shouldn't fail the whole run when deploy already succeeded; the
      # comment above already treats a cache-miss window as an acceptable
      # cost, so failing to even TRIGGER the purge is the same bounded
      # degradation, not a functional loss. -sf alone swallowed the response
      # body on failure (bare exit 22, no clue why) — capture it so the next
      # failure is actually diagnosable from the Actions log.
      - name: Purge Cloudflare cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ZONE_ID != ''
        continue-on-error: true
        run: |
          resp=$(curl -s -w '\n%{http_code}' -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          code=$(tail -n1 <<< "$resp")
          body=$(sed '$d' <<< "$resp")
          if [ "$code" != "200" ]; then
            echo "::warning::Cache purge failed (HTTP $code): $body"
          else
            echo "$body"
          fi

      # Loads whatever gen-search-index.ts produced above — normally a small
      # incremental diff (few hundred writes), occasionally a full rebuild
      # (~30k writes, first run or after a bulk import) against D1's
      # 100k writes/day free quota. gen-search-index.ts caps each SQL file at
      # 5MB specifically so a big diff spans multiple files instead of one
      # remote import stalling out — but this step used to run only
      # dist/search-index/000.sql, a leftover from before that split existed,
      # so any 001.sql+ from a large diff was silently never applied. Loop
      # over every file, same as the local `search:index` pnpm script (which
      # never had this bug — it already loops). continue-on-error: a D1
      # hiccup (auth, quota, transient API error) shouldn't fail the whole CI
      # run when the actual deploy (Worker + R2) above it already succeeded —
      # search goes briefly stale, not the site.
      - name: Refresh search index (D1)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: |
          fail=0
          for f in dist/search-index/*.sql; do
            pnpm exec wrangler d1 execute athar-search --remote -y --file "$f" || { echo "::warning::D1 import failed for $f — continuing to next file"; fail=1; }
          done
          exit $fail
