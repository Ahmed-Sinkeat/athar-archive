name = "athar-search-api"
main = "index.ts"
compatibility_date = "2025-01-01"
routes = [{ pattern = "search.arthurarchive.com", custom_domain = true }]

# Run next to the D1 primary: one search is several sequential queries (one per rank tier plus
# snippets), each ~19 ms in D1 but a full edge→D1 round trip when the Worker runs near the user.
[placement]
mode = "smart"

[observability]
enabled = true

[[d1_databases]]
binding = "SEARCH"
database_name = "athar-search"
database_id = "e504e022-1bc1-4d05-a482-e1f815c31004"

[[analytics_engine_datasets]]
binding = "HITS"
dataset = "athar_app"
