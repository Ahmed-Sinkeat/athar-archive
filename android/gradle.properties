# ponytail: 7.5 GB machine — Gradle + Kotlin daemons at 3g each plus R8 pushed RAM+swap past 90% and systemd-oomd killed the terminal. Raise only on a bigger box.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=3
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
